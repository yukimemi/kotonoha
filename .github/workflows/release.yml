name: Release to crates.io

# Tag-driven release pipeline. Pushing a `v*` tag publishes all four
# kotonoha-* crates to crates.io and attaches per-OS binaries to the
# GitHub Release.
#
# Internal workspace deps are declared with both `path` and `version`
# so cargo publish keeps the version on the published manifest while
# local builds keep using the path.
#
# Requires the `CARGO_REGISTRY_TOKEN` repo secret.
#
# Layout adapted from yukimemi/kanade — same workspace pattern, but
# kotonoha has no Windows-only target deps so build-artifacts runs
# cleanly on all three OSes without #[cfg] gymnastics.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # upload binaries to the GitHub Release

jobs:
  # Build native release binaries on every supported OS and attach
  # them to the GitHub Release. The single bin lives in
  # `kotonoha-server` and is renamed `kotonoha` via [[bin]] in
  # its Cargo.toml.
  #
  # This job is the gating step for `publish-crates` (below) —
  # fail-fast across the OS matrix to abort the release early when
  # a Linux- or macOS-only compile error sneaks in.  Costs ~5 min
  # latency for a release, buys the invariant "if it's on crates.io,
  # every supported OS could build it."
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_label: 'windows'
          - os: ubuntu-latest
            target_label: 'linux'
          - os: macos-latest
            target_label: 'macos-arm64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        # rust-cache restore has flaked on transient GH Actions cache
        # backend errors before; fall through to a cold build instead
        # of failing the whole release pipeline.
        continue-on-error: true

      - name: Build release binary
        run: cargo build --release -p kotonoha-server

      # Rename per-OS for the release page so all three coexist on
      # one tag.  Windows keeps the bare `kotonoha.exe` form.
      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p staged
          if [ "${{ matrix.target_label }}" = "windows" ]; then
            cp target/release/kotonoha.exe staged/
          else
            cp target/release/kotonoha staged/kotonoha-${{ matrix.target_label }}
          fi
          ls -la staged/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true

  # crates.io publish is OS-agnostic and only needs to run once per
  # tag, so keep it on a single Windows runner (matches the
  # primary-dev target and `cargo publish --verify` exercise paths
  # the maintainer touches daily).
  #
  # Publish in dependency order:
  #   1. kotonoha-core    (no internal deps)
  #   2. kotonoha-tts     (no internal deps — Kokoro / hound only)
  #   3. kotonoha-llm     (depends on kotonoha-core)
  #   4. kotonoha-server  (depends on all three above)
  #
  # A 60s sleep between publishes lets the crates.io sparse index
  # propagate before the next crate's `cargo publish --verify`
  # tries to resolve the newly-uploaded version.
  publish-crates:
    needs: build-artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        continue-on-error: true

      - name: Publish kotonoha-core
        run: cargo publish -p kotonoha-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        shell: bash
        run: sleep 60

      - name: Publish kotonoha-tts
        run: cargo publish -p kotonoha-tts --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        shell: bash
        run: sleep 60

      - name: Publish kotonoha-llm
        run: cargo publish -p kotonoha-llm --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        shell: bash
        run: sleep 60

      - name: Publish kotonoha-server
        run: cargo publish -p kotonoha-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

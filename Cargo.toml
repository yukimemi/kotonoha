[workspace]
resolver = "2"
members = [
    "backend/crates/kotonoha-core",
    "backend/crates/kotonoha-llm",
    "backend/crates/kotonoha-server",
    "backend/crates/kotonoha-tts",
]

[workspace.package]
version      = "0.1.10"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/yukimemi/kotonoha"
homepage     = "https://github.com/yukimemi/kotonoha"
authors      = ["yukimemi <yukimemi@gmail.com>"]

[workspace.dependencies]
tokio              = { version = "1.52.3", features = ["full"] }
tokio-util         = { version = "0.7.18", features = ["io"] }
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.150"
toml               = "1.1.2"
teravars           = { version = "0.1.6", features = ["merge"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow             = "1.0.102"
thiserror          = "2.0.18"
clap               = { version = "4.6.1", features = ["derive", "env"] }
axum               = { version = "0.8.9", features = ["ws", "macros"] }
tower-http         = { version = "0.6.11", features = ["cors", "trace", "fs"] }
futures            = "0.3.32"
uuid               = { version = "1.23.1", features = ["v4", "serde"] }
async-stream       = "0.3.6"
async-trait        = "0.1.89"
hound              = "3.5.1"
which              = "8.0.2"
reqwest            = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes              = "1.11.1"
rust-embed         = "8.11.0"
mime_guess         = "2.0.5"
voicevox-dyn       = "0.3"
indicatif          = "0.18"

[profile.dev]
debug = "line-tables-only"

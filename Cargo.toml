[workspace]
resolver = "2"
members = [
    "backend/crates/kotonoha-core",
    "backend/crates/kotonoha-llm",
    "backend/crates/kotonoha-server",
    "backend/crates/kotonoha-tts",
]

[workspace.package]
version      = "0.4.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/yukimemi/kotonoha"
homepage     = "https://github.com/yukimemi/kotonoha"
authors      = ["yukimemi <yukimemi@gmail.com>"]

[workspace.dependencies]
tokio              = { version = "1.53.1", features = ["full"] }
tokio-util         = { version = "0.7.19", features = ["io"] }
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
toml               = "1.1.4"
teravars           = { version = "0.2.1", features = ["merge"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow             = "1.0.104"
thiserror          = "2.0.20"
clap               = { version = "4.6.6", features = ["derive", "env"] }
axum               = { version = "0.8.9", features = ["ws", "macros"] }
tower-http         = { version = "0.7.0", features = ["cors", "trace", "fs"] }
futures            = "0.3.34"
uuid               = { version = "1.24.0", features = ["v4", "serde"] }
async-stream       = "0.3.6"
async-trait        = "0.1.92"
hound              = "3.5.1"
which              = "8.0.5"
reqwest            = { version = "0.13.4", features = ["json", "stream", "rustls"], default-features = false }
bytes              = "1.12.1"
rust-embed         = "8.12.0"
mime_guess         = "2.0.5"
indicatif          = "0.18.6"

[profile.dev]
debug = "line-tables-only"

[package]
name        = "kotonoha-llm"
description = "Direct HTTP API backends for kotonoha (Gemini today; Anthropic / OpenAI in scope)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
# `path` + `version` so cargo publish keeps the version-pinned dep on
# the published manifest while local builds still resolve via path.
kotonoha-core = { path = "../kotonoha-core", version = "0.1.13" }

anyhow       = { workspace = true }
async-stream = { workspace = true }
async-trait  = { workspace = true }
bytes        = { workspace = true }
futures      = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

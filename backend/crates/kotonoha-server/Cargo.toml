[package]
name        = "kotonoha-server"
description = "axum HTTP + WebSocket server that bridges the kotonoha frontend to claude/gemini/codex CLIs"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
# Package name on crates.io is `kotonoha-server` (since `kotonoha`
# itself was squatted in 2019 by an old logging crate), but the
# user-facing executable stays `kotonoha`. Users do
# `cargo install kotonoha-server` once, then `kotonoha` every day.
name = "kotonoha"
path = "src/main.rs"

[dependencies]
kotonoha-core = { path = "../kotonoha-core" }
kotonoha-llm  = { path = "../kotonoha-llm" }
kotonoha-tts  = { path = "../kotonoha-tts" }

anyhow             = { workspace = true }
axum               = { workspace = true }
clap               = { workspace = true }
futures            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

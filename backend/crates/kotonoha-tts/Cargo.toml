[package]
name        = "kotonoha-tts"
description = "Kokoro TTS adapter for kotonoha — wraps `kokoro-en` (pure-Rust, no espeak) and exposes WAV-bytes synthesis"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
anyhow      = { workspace = true }
hound       = { workspace = true }
# VOICEVOX 0.16+ C-API is loaded via libloading. We talk to it
# directly instead of voicevox-dyn so we can keep up with the
# c_api/lib/ + models/vvms/ + onnxruntime/lib/ asset layout that
# the current downloader produces (voicevox-dyn 0.3 still expects
# the legacy flat layout next to the exe).
libloading  = "0.9.0"
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

# Kokoro 82M ONNX inference, pure-Rust phonemizer (misaki-lean).
# Skip the espeak-ng C++ build path — that path requires CMake + MSVC
# on Windows and adds a 60s+ build, plus the runtime depends on a
# native DLL.  `misaki-lean` uses a Rust-only G2P that's good enough
# for an English-speaking-with-occasional-Japanese teacher scenario.
kokoro-en = { version = "0.1.4", default-features = false, features = ["misaki-lean"] }

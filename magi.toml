# magi competing on kotonoha.
#
# **Only what is peculiar to this checkout lives here.** The roster, the seat
# assignment, the shape of a run and the update policy are stated once in the
# machine layer (`<config_dir>/magi/config.toml`), because none of them are
# facts about this repository: they are facts about which agent CLIs are
# installed and what the operator is willing to spend. This file holds only
# what a different machine would still need to be told.
#
# What that leaves, and why each one has to be here:
#
# - `[verify]` runs `cargo`, against paths and a gate command specific to this
#   repo. The machine layer has no `[verify]` at all — without one here,
#   `verify.gate` is empty, magi skips the gate entirely (`src/graph.rs`,
#   `if !self.state.gate.is_empty()`), and reports a run clean whether or not
#   it actually builds.
# - `[merge] base` names this repository's branch, and is required at all
#   because of how this checkout is set up (see below).
# - `[prompts]` are this project's conventions.
#
# Note that an array may be declared in exactly one layer
# (`Config::refuse_split_arrays`), so `[verify]`'s arrays being here is also
# why the roster's arrays are *only* in the machine layer.
#
# Rendered by teravars. Tera braces are live everywhere in this file, but
# comments are stripped before Tera sees them (teravars >= 0.2.2), so a comment
# may quote `{{ ... }}` freely.

[vars]
# Shared build cache for the verification commands. Override per machine with
# MAGI_CACHE. Lives beside its only consumer: `[vars]` is rendered per file, so
# a value used by this file's templates is stated in this file.
cache = "{{ env.MAGI_CACHE | default(value='/tmp') }}"

[verify]
# The real-machine leg, run in the winner's worktree once per review round,
# with its output handed to the fixer.
#
# CARGO_TARGET_DIR is shared on purpose: each candidate worktree would
# otherwise compile this workspace from scratch, which dwarfs everything else
# a review round does. Only the winner's worktree runs these commands, and
# only one at a time, so nothing contends on cargo's lock.
e2e = ["CARGO_TARGET_DIR={{ vars.cache }}/kotonoha-target cargo test --locked --all-targets"]

# The final gate before merge, matched to `.github/workflows/ci.yml`.
# `Makefile.toml`'s `[tasks.check]` already advertises itself as "same as CI"
# and lists editorconfig-check + fmt-check + clippy + test + lock-check as its
# dependencies, which is a 1:1 cover of the CI job set:
#   - `check` (cargo check --all-targets)   <- subsumed by lock-check, which
#                                               runs `cargo check --locked
#                                               --all-targets`, a strict
#                                               superset
#   - `test` (cargo test --all-targets [+ --doc if src/lib.rs exists])
#                                            <- tasks.test (test-targets +
#                                               conditional test-doc), same
#                                               condition
#   - `fmt` (cargo fmt --all -- --check)    <- tasks.fmt-check
#   - `editorconfig` (editorconfig-checker) <- tasks.editorconfig-check
#                                               (present on both sides, which
#                                               is the correct state here —
#                                               CI always enforces it via the
#                                               Action, the Makefile task
#                                               degrades to a no-op only when
#                                               the binary isn't on PATH)
#   - `clippy` (cargo clippy --all-targets -- -D warnings) <- tasks.clippy
#   - `lockfile` (cargo check --locked --all-targets)      <- tasks.lock-check
#     (identical command)
#
# `coverage` (cargo llvm-cov + Codecov upload) is deliberately left out of the
# gate: it isn't in `[tasks.check]`'s dependencies either, it uploads to an
# external service rather than asserting anything about the tree, and CI
# itself doesn't gate on it (`fail_ci_if_error: false`). Nothing merge-blocking
# is being skipped by leaving it out.
#
# With that cover confirmed, the gate is just `cargo make check`.
gate = ["CARGO_TARGET_DIR={{ vars.cache }}/kotonoha-target cargo make check"]

[merge]
# `mode` is left unset on purpose, so this repo inherits the machine layer's
# `"pr"` rather than falling back to the built-in default of `"none"`.
# `"none"` only prints the merge command and leaves the branch for a human to
# run it, which is exactly the failure the machine layer's `[merge]` comment
# documents by incident (run `20260907-075524-520f`): a clean, ready run sat
# unmerged until someone did it by hand. Restating `"none"` here would
# reintroduce that for this repo alone.
#
# `base` is what's actually required here, and in every jj-colocated repo: jj
# keeps git's HEAD detached at the working-copy commit, so magi cannot infer
# the base branch from `git symbolic-ref HEAD`. Teaching magi to read the jj
# bookmark instead is a real feature, not a workaround.
base = "main"

# Project conventions appended to the node prompts, never merged into them.
# Repository-wide context lives in AGENTS.md, which every agent already reads
# from the checkout; these are the things a magi *node* needs to know.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works \
in a candidate worktree and is what magi expects, but never run `jj` commands \
and never touch the main working copy.
"""
